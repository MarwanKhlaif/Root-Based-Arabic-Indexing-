[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "arabic-ir-indexing"
version = "0.1.0"
description = "Root-Based Arabic Full-Text Indexing in PostgreSQL 16"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = {text = "MIT"}
authors = [
    {name = "Marwan Mohammed Khulaif"}
]
keywords = [
    "information-retrieval",
    "arabic-nlp",
    "postgresql",
    "stemming",
    "full-text-search"
]
dependencies = [
    "psycopg[binary]>=3.2.0",
    "pytest>=8.0.0",
    "nltk>=3.9.0",
    "pandas>=2.2.0",
    "pyarrow>=17.0.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --strict-markers"
markers = [
    "db: tests requiring a running PostgreSQL database",
    "unit: standalone unit tests",
]
