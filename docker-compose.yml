name: arabic_ir

services:
  arabic_ir_db:
    image: postgres:16
    container_name: arabic_ir_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: arabic_ir
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d arabic_ir"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s

  arabic_ir_web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: arabic_ir_web
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PGHOST=arabic_ir_db
      - PGPORT=5432
      - PGDATABASE=arabic_ir
      - PGUSER=postgres
      - PGPASSWORD=postgres_password
      - PORT=8000
    depends_on:
      arabic_ir_db:
        condition: service_healthy
    volumes:
      - ./results:/app/results:ro
      - ./queries:/app/queries:ro

volumes:
  pgdata:
